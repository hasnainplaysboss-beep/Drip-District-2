
name: Extract Drip District Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project into root
        run: |
          unzip -o drip-district-complete-project.zip -d .
          rm drip-district-complete-project.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract Drip District project into repository root" || echo "Nothing to commit"
          git push
